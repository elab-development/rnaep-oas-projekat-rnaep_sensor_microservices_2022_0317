name: CD - Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ closed ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true || github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Sensor Service
        uses: docker/build-push-action@v4
        with:
          context: ./sensor-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sensor-service:latest

      - name: Build and push Irrigation Service
        uses: docker/build-push-action@v4
        with:
          context: ./irrigation-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/irrigation-service:latest

      - name: Build and push Alert Service
        uses: docker/build-push-action@v4
        with:
          context: ./alert-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/alert-service:latest

      - name: Build and push API Gateway
        uses: docker/build-push-action@v4
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build and push UI
        uses: docker/build-push-action@v4
        with:
          context: ./ui
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ui:latest

      - name: Build and push Simulator
        uses: docker/build-push-action@v4
        with:
          context: ./simulator
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/simulator:latest

      - name: Image digest
        run: echo "✅ Docker images pushed to Docker Hub as ${{ secrets.DOCKER_USERNAME }}"